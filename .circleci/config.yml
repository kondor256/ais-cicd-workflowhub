version: 2.1

jobs:
  test-frontend:
    docker:
      # Vitest 5 needs Node 22 or newer
      - image: cimg/node:22.23
    working_directory: ~/project/frontend
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run frontend tests
          # The JUnit report fills the Tests tab of the CircleCI job page
          command: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml
      - store_test_results:
          path: test-results

  build-images:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      # Docker builds run on a separate remote Docker engine (default version)
      - setup_remote_docker
      - run:
          name: Build backend image
          command: docker build -t workflowhub-backend:ci ./backend
      - run:
          name: Build frontend image
          # VITE_API_URL is a CircleCI project environment variable
          # (Project Settings > Environment Variables), not set in this file
          command: docker build --build-arg VITE_API_URL="$VITE_API_URL" -t workflowhub-frontend:ci ./frontend

workflows:
  ci:
    # No branch filter: runs on every branch
    jobs:
      - test-frontend
      - build-images:
          requires:
            - test-frontend
