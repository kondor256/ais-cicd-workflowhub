version: 2.1

jobs:
  test-frontend:
    docker:
      - image: cimg/node:22.23
    working_directory: ~/project/frontend
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run frontend tests
          command: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml
      - store_test_results:
          path: test-results

  test-backend:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project/backend
    environment:
      DATABASE_URL: sqlite:///db.sqlite3
      DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-production"
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install backend dependencies
          command: pip install -r requirements.txt
      - run:
          name: Run backend tests
          command: python manage.py test

  build-images:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build backend image
          command: docker build -t workflowhub-backend:ci ./backend
      - run:
          name: Build frontend image
          command: docker build --build-arg VITE_API_URL="$VITE_API_URL" -t workflowhub-frontend:ci ./frontend

workflows:
  ci:
    jobs:
      - test-frontend
      - test-backend
      - build-images:
          requires:
            - test-frontend
            - test-backend
