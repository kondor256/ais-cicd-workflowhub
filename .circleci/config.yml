version: 2.1

jobs:
  test-frontend:
    docker:
      - image: cimg/node:22.23
    working_directory: ~/project/frontend
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run frontend tests
          command: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml
      - store_test_results:
          path: test-results

  test-backend:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project/backend
    environment:
      DATABASE_URL: sqlite:///db.sqlite3
      DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-production"
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install backend dependencies
          command: pip install -r requirements.txt
      - run:
          name: Run backend tests
          command: python manage.py test

  build-images:
    environment:
      VITE_API_URL: "https://workflowhub-backend-v1jm.onrender.com"
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build backend image
          command: docker build -t workflowhub-backend:ci ./backend
      - run:
          name: Build frontend image
          command: docker build --build-arg VITE_API_URL="$VITE_API_URL" -t workflowhub-frontend:ci ./frontend
  publish-render-images:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Login to GitHub Container Registry
          command: |
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin
      
      - run:
          name: Build and push backend image
          command: |
            docker build \
              --build-arg GIT_SHA="${CIRCLE_SHA1}" \
              -t ghcr.io/kondor256/workflowhub-backend:circleci-${CIRCLE_SHA1} \
              ./backend
            docker push ghcr.io/kondor256/workflowhub-backend:circleci-${CIRCLE_SHA1}
      - run:
          name: Build and push frontend image
          command: |
            docker build \
              --build-arg VITE_API_URL="$VITE_API_URL" \
              -t ghcr.io/kondor256/workflowhub-frontend:render-${CIRCLE_SHA1} \
              ./frontend
            docker push ghcr.io/kondor256/workflowhub-frontend:render-${CIRCLE_SHA1}
  deploy-render:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Deploy backend to Render
          command: |
            curl --fail --silent --show-error --get -X POST \
              --data-urlencode "imgURL=ghcr.io/kondor256/workflowhub-backend:circleci-${CIRCLE_SHA1}" \
              "$BACKEND_DEPLOY_HOOK"

      - run:
          name: Verify backend deployment
          command: |
            EXPECTED_SHA="${CIRCLE_SHA1}"
            HEALTH_URL="https://workflowhub-backend-v1jm.onrender.com/api/health/"

            for attempt in $(seq 1 20); do
              RESPONSE=$(curl --fail --silent --show-error "$HEALTH_URL" || true)
              echo "Attempt $attempt: $RESPONSE"

              if echo "$RESPONSE" | grep -Eq "\"git_sha\"[[:space:]]*:[[:space:]]*\"${EXPECTED_SHA}\""; then
                echo "Backend deployment verified: ${EXPECTED_SHA}"
                exit 0
              fi

              sleep 15
            done

            echo "Backend deployment did not report expected SHA: ${EXPECTED_SHA}"
            exit 1


      - run:
          name: Deploy frontend to Render
          command: |
            curl --fail --silent --show-error --get -X POST \
              --data-urlencode "imgURL=ghcr.io/kondor256/workflowhub-frontend:render-${CIRCLE_SHA1}" \
              "$FRONTEND_DEPLOY_HOOK"
      - run:
          name: Verify frontend deployment
          command: |
            FRONTEND_URL="https://workflowhub-frontend.onrender.com"

            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error -o /dev/null "$FRONTEND_URL"; then
                echo "Frontend deployment verified"
                exit 0
              fi

              echo "Frontend not ready yet. Attempt $attempt"
              sleep 15
            done

            echo "Frontend deployment verification failed"
            exit 1

workflows:
  ci:
    jobs:
      - test-frontend
      - test-backend
      - build-images:
          requires:
            - test-frontend
            - test-backend
      - publish-render-images:
          requires:
            - build-images
          context:
            - ghcr-push
          filters:
            branches:
              only: /^(main|ci\/39-deploy-render-circleci)$/
      - deploy-render:
          requires:
            - publish-render-images
          context:
            - render-deploy
          filters:
            branches:
              only: main
