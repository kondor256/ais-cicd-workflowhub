
version: 2.1

jobs:
  test-frontend:
    docker:
      - image: cimg/node:22.23
    working_directory: ~/project/frontend
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run frontend tests
          command: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml
      - store_test_results:
          path: test-results

  test-backend:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project/backend
    environment:
      DATABASE_URL: sqlite:///db.sqlite3
      DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-production"
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install backend dependencies
          command: pip install -r requirements.txt
      - run:
          name: Run backend tests
          command: python manage.py test

  # WFH-23: Playwright end-to-end testing
  e2e:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project

    # Disposable values for the isolated CI test environment.
    environment:
      POSTGRES_DB: workflowhub_ci
      POSTGRES_USER: workflowhub_ci
      POSTGRES_PASSWORD: ci-only-password-not-for-production
      DJANGO_SECRET_KEY: ci-only-e2e-secret-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080"
      VITE_API_URL: "http://localhost:8000"
      CI: "true"

    steps:
      - checkout

      - run:
          name: Check Docker and Docker Compose
          command: |
            docker version
            docker compose version

      - run:
          name: Start WorkFlowHub application
          command: docker compose up -d --build --wait

      - run:
          name: Verify backend health
          command: |
            for attempt in $(seq 1 30); do
              if curl -fsS --connect-timeout 5 --max-time 10 \
                http://localhost:8000/api/health/; then
                echo "Backend is ready"
                exit 0
              fi
              echo "Backend not ready. Attempt $attempt/30"
              sleep 2
            done
            echo "Backend health check failed"
            exit 1

      - run:
          name: Verify frontend availability
          command: |
            for attempt in $(seq 1 30); do
              if curl -fsS --connect-timeout 5 --max-time 10 \
                -o /dev/null http://localhost:8080/; then
                echo "Frontend is ready"
                exit 0
              fi
              echo "Frontend not ready. Attempt $attempt/30"
              sleep 2
            done
            echo "Frontend availability check failed"
            exit 1

      - run:
          name: Run Playwright E2E tests
          command: |
            docker run --rm --network host \
              -e CI=true \
              -e E2E_BASE_URL=http://localhost:8080 \
              -v "$PWD/e2e:/work" \
              -w /work \
              mcr.microsoft.com/playwright:v1.65.0-noble \
              bash -lc "npm ci && npx playwright test"

      - store_test_results:
          path: e2e/test-results

      - store_artifacts:
          path: e2e/playwright-report
          destination: playwright-report

      - store_artifacts:
          path: e2e/test-results
          destination: playwright-test-results

      - run:
          name: Show Docker logs on failure
          when: on_fail
          command: docker compose logs --tail=100

      - run:
          name: Clean up test environment
          when: always
          command: docker compose down -v

  build-images:
    environment:
      VITE_API_URL: "https://workflowhub-backend-v1jm.onrender.com"
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build backend image
          command: docker build -t workflowhub-backend:ci ./backend
      - run:
          name: Build frontend image
          command: docker build --build-arg VITE_API_URL="$VITE_API_URL" -t workflowhub-frontend:ci ./frontend

  publish-render-images:
    environment:
      VITE_API_URL: "https://workflowhub-backend-v1jm.onrender.com"
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Login to GitHub Container Registry
          command: |
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin

      - run:
          name: Build and push backend image
          command: |
            docker build \
              --build-arg GIT_SHA="${CIRCLE_SHA1}" \
              -t ghcr.io/kondor256/workflowhub-backend:circleci-${CIRCLE_SHA1} \
              ./backend
            docker push ghcr.io/kondor256/workflowhub-backend:circleci-${CIRCLE_SHA1}

      - run:
          name: Build and push frontend image
          command: |
            docker build \
              --build-arg VITE_API_URL="$VITE_API_URL" \
              -t ghcr.io/kondor256/workflowhub-frontend:render-${CIRCLE_SHA1} \
              ./frontend
            docker push ghcr.io/kondor256/workflowhub-frontend:render-${CIRCLE_SHA1}

  # WFH-23: Run Playwright against Render after deployment.
  e2e-render:
    docker:
      - image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_directory: ~/project
    environment:
      CI: "true"
      E2E_BASE_URL: "https://workflowhub-frontend.onrender.com"

    steps:
      - checkout

      - run:
          name: Install Playwright dependencies
          command: |
            cd e2e
            npm ci

      - run:
          name: Run E2E tests against Render
          command: |
            cd e2e
            npx playwright test

      - store_test_results:
          path: e2e/test-results

      - store_artifacts:
          path: e2e/playwright-report
          destination: render-playwright-report

      - store_artifacts:
          path: e2e/test-results
          destination: render-test-results

  deploy-render:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Deploy backend to Render
          command: |
            : "${RENDER_BACKEND_DEPLOY_HOOK:?is not set in context render-deploy}"
            curl --fail --silent --show-error --get -X POST \
              --data-urlencode "imgURL=ghcr.io/kondor256/workflowhub-backend:circleci-${CIRCLE_SHA1}" \
              "$RENDER_BACKEND_DEPLOY_HOOK"

      - run:
          name: Verify backend deployment
          command: |
            EXPECTED_SHA="${CIRCLE_SHA1}"
            HEALTH_URL="https://workflowhub-backend-v1jm.onrender.com/api/health/"

            for attempt in $(seq 1 20); do
              RESPONSE=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 "$HEALTH_URL" || true)
              echo "Attempt $attempt: $RESPONSE"

              if echo "$RESPONSE" | grep -Eq "\"git_sha\"[[:space:]]*:[[:space:]]*\"${EXPECTED_SHA}\""; then
                echo "Backend deployment verified: ${EXPECTED_SHA}"
                exit 0
              fi

              sleep 15
            done

            echo "Backend deployment did not report expected SHA: ${EXPECTED_SHA}"
            exit 1

      - run:
          name: Smoke test backend database (wrong-password login must return 400)
          command: |
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -X POST \
              -H "Content-Type: application/json" \
              -d '{"username":"smoke-test","password":"wrong-password"}' \
              https://workflowhub-backend-v1jm.onrender.com/api/auth/login/)
            echo "Login with wrong password returned HTTP $CODE"
            if [ "$CODE" != "400" ]; then
              echo "Backend database check failed (expected 400)"
              exit 1
            fi

      - run:
          name: Deploy frontend to Render
          command: |
            : "${RENDER_FRONTEND_DEPLOY_HOOK:?is not set in context render-deploy}"
            curl --fail --silent --show-error --get -X POST \
              --data-urlencode "imgURL=ghcr.io/kondor256/workflowhub-frontend:render-${CIRCLE_SHA1}" \
              "$RENDER_FRONTEND_DEPLOY_HOOK"

      - run:
          name: Verify frontend deployment
          command: |
            FRONTEND_URL="https://workflowhub-frontend.onrender.com"

            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 -o /dev/null "$FRONTEND_URL"; then
                echo "Frontend is reachable"
                exit 0
              fi

              echo "Frontend not ready yet. Attempt $attempt"
              sleep 15
            done

            echo "Frontend deployment verification failed"
            exit 1

workflows:
  ci:
    jobs:
      - test-frontend
      - test-backend
      - e2e

      - build-images:
          requires:
            - test-frontend
            - test-backend
            - e2e

      - publish-render-images:
          requires:
            - build-images
          context:
            - ghcr-push
          filters:
            branches:
              only: main

      - deploy-render:
          requires:
            - publish-render-images
          context:
            - render-deploy
          filters:
            branches:
              only: main
      - e2e-render:
          requires:
            - deploy-render
          filters:
            branches:
              only: main