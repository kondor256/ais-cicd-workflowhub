name: User story / Enabler
description: A backlog item for WorkFlowHub (application feature or DevOps enabler)
title: "WFH-XX: "
body:
  - type: markdown
    attributes:
      value: |
        Write the story so that it meets the **Definition of Ready**. Story points are added later, at backlog refinement, on the Project board.
  - type: input
    id: story_id
    attributes:
      label: Story ID
      description: Next free backlog ID, e.g. WFH-16
      placeholder: WFH-XX
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - User story
        - Enabler
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner role
      options:
        - Developer
        - DevOps engineer
        - Product Owner
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options:
        - Must
        - Should
        - Could
        - Won't (this release)
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a <role>, I want <goal>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One testable criterion per line, in Given / When / Then form.
      placeholder: "- Given …, when …, then …"
    validations:
      required: true
  - type: textarea
    id: subtasks
    attributes:
      label: Sub-tasks
      placeholder: "- [ ] …"
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "#2 (WFH-02) or None"
  - type: input
    id: branch
    attributes:
      label: Branch name
      placeholder: "feature/<issue number>-short-slug"
  - type: textarea
    id: notes
    attributes:
      label: Notes
  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready
      options:
        - label: Written as "As a … I want … so that …"
        - label: Acceptance criteria are testable (Given / When / Then)
        - label: Dependencies are known
