name: Bug report
description: Something in WorkFlowHub does not work as expected
title: "WFH-XX: Bug: "
labels: ["bug"]
body:
  - type: input
    id: bug_id
    attributes:
      label: Bug ID
      placeholder: WFH-XX
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Likely cause (if known)
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (for the fix)
      placeholder: "- Given …, when …, then …"
  - type: textarea
    id: subtasks
    attributes:
      label: Sub-tasks
      placeholder: "- [ ] …"
  - type: input
    id: related
    attributes:
      label: Related items
      placeholder: "#2 (WFH-02)"
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch name
      placeholder: "fix/<issue number>-short-slug"
