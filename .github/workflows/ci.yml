name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer run on the same branch or PR cancels the older one
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Ruff
        run: pip install -r backend/requirements-dev.txt

      - name: Lint backend (Ruff)
        working-directory: backend
        run: ruff check --output-format=github .

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (oxlint)
        working-directory: frontend
        run: npm run lint

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: python manage.py test
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          # A plain value, not a secret: tests use a throwaway SQLite file
          DATABASE_URL: sqlite:///db.sqlite3

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Vitest 5 needs Node 22 or newer
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        # The tests replace fetch, so no backend or secrets are needed
        run: npm test

  build-images:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: workflowhub-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: workflowhub-frontend:ci
          # VITE_API_URL is a repository variable (Settings > Secrets and variables > Actions > Variables)
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend



  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Temporary values for this isolated CI test environment only.
    env:
      POSTGRES_DB: workflowhub_ci
      POSTGRES_USER: workflowhub_ci
      POSTGRES_PASSWORD: ci-only-password-not-for-production
      DJANGO_SECRET_KEY: ci-only-ephemeral-test-secret-key-not-for-production-2026
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080"
      VITE_API_URL: "http://localhost:8000"
      E2E_BASE_URL: "http://localhost:8080"
      CI: "true"

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start the full application
        run: docker compose up -d --build --wait

      - name: Verify backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health/; then
              exit 0
            fi
            echo "Backend not ready, retrying..."
            sleep 2
          done
          exit 1

      - name: Verify frontend availability
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            echo "Frontend not ready, retrying..."
            sleep 2
          done
          exit 1

      - name: Run Playwright end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --tail=100
