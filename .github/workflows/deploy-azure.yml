name: Deploy to Azure

# Toolchain A: every push to main is built, pushed to GHCR and deployed to Azure Container Apps.
# The branch ci/38-deploy-azure is listed only while WFH-18 is being tested; it is removed before merge.
on:
  push:
    branches: [main, ci/38-deploy-azure]
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one after another; a newer push never cancels a deploy that has started
concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-workflowhub-a2
  BACKEND_APP: ca-wfh-backend
  FRONTEND_APP: ca-wfh-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The environment holds the Azure IDs and VITE_API_URL (variables, not secrets) and
    # records every deployment on the repo page. Azure trusts only jobs in this environment.
    environment:
      name: azure-production
      url: ${{ steps.urls.outputs.frontend }}
    permissions:
      contents: read
      packages: write   # push images to GHCR with GITHUB_TOKEN
      id-token: write   # request the OIDC token for azure/login
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Image names on ghcr.io must be lower-case, but the owner name may not be
      - name: Set image names and tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/workflowhub-backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/workflowhub-frontend:azure-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}
          # Returned by /api/health/, so the smoke test can tell the new version from the old one
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}
          # Vite bakes the API URL into the bundle, so this image is built for Azure only
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha,scope=frontend-azure
          cache-to: type=gha,mode=max,scope=frontend-azure

      # OIDC: GitHub issues a short-lived token; Azure accepts it through the federated
      # credential on the managed identity. No Azure password or key is stored in GitHub.
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.BACKEND_APP }}
          imageToDeploy: ${{ env.BACKEND_IMAGE }}

      - name: Get the app URLs
        id: urls
        run: |
          backend=$(az containerapp show -g "$RESOURCE_GROUP" -n "$BACKEND_APP" --query properties.configuration.ingress.fqdn -o tsv)
          frontend=$(az containerapp show -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "backend=https://${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend=https://${frontend}" >> "$GITHUB_OUTPUT"

      # The app scales to zero, so the first request may wait for a cold start and the migrations
      - name: Smoke test the backend (waits for the new version)
        run: |
          url="${{ steps.urls.outputs.backend }}/api/health/"
          for i in $(seq 1 30); do
            body=$(curl -s --max-time 30 "$url" || true)
            echo "Attempt $i: $body"
            if echo "$body" | grep -q "\"version\":\"${GITHUB_SHA}\""; then
              echo "Backend ${GITHUB_SHA} is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The backend did not report version ${GITHUB_SHA} within 5 minutes"
          exit 1

      - name: Deploy frontend to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.FRONTEND_APP }}
          imageToDeploy: ${{ env.FRONTEND_IMAGE }}

      - name: Smoke test the frontend
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ steps.urls.outputs.frontend }}/" || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::The frontend did not answer 200"
          exit 1

      - name: Write the job summary
        if: always()
        run: |
          {
            echo "## Azure deployment (toolchain A)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Backend image | \`${BACKEND_IMAGE}\` |"
            echo "| Frontend image | \`${FRONTEND_IMAGE}\` |"
            echo "| Backend | ${{ steps.urls.outputs.backend }}/api/health/ |"
            echo "| Frontend | ${{ steps.urls.outputs.frontend }} |"
            echo "| Finished (UTC) | $(date -u '+%Y-%m-%d %H:%M:%S') |"
          } >> "$GITHUB_STEP_SUMMARY"
